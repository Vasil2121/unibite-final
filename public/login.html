<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Σύνδεση — UniBite</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/header-footer.css">
</head>
<body>

<div id="site-header"></div>

<main class="site-main">

<div class="container">

    <section class="card">

        <h1>Σύνδεση στο UniBite</h1>
        <p>Συνδέσου για να δεις τις διαθέσιμες μερίδες ή να μοιραστείς δικές σου.</p>

        <div id="form-alert" class="alert-error is-hidden"></div>

        <form id="login-form">

            <div>
                <label class="form-label" for="identifier">Username ή Email</label>
                <input
                    class="form-input"
                    type="text"
                    id="identifier"
                    name="identifier"
                    required
                    maxlength="100"
                    autocomplete="username"
                    autofocus
                >
                <small class="form-error" data-error-for="identifier"></small>
            </div>

            <div>
                <label class="form-label" for="password">Κωδικός</label>
                <input
                    class="form-input"
                    type="password"
                    id="password"
                    name="password"
                    required
                    maxlength="255"
                    autocomplete="current-password"
                >
                <small class="form-error" data-error-for="password"></small>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">
                Σύνδεση
            </button>

        </form>

        <p>
            Δεν έχεις λογαριασμό; <a href="/register.html">Εγγραφή εδώ</a>
        </p>

    </section>
</div>

</main>

<div id="site-footer"></div>

<script type="module" src="/js/pages/login.js"></script>
</body>
</html>
